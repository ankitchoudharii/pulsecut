name: Build PulseCut Pro Android Tablet APK

on:
  push:
    branches: [ "main", "master", "**" ]
  workflow_dispatch:

jobs:
  build-tablet-apk:
    name: Build Installable Android Tablet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP automatically (Uploaded from Android Tablet)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then
                echo "Unpacking $z..."
                unzip -o "$z" -d .
              fi
            done
          fi
          chmod +x gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 26.1 & CMake 3.22.1
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Bundle Cactus Whistle 16.9 MB Model (whistle.cact)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 \
            "https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact" \
            -o app/src/main/assets/models/whistle.cact || echo "Using on-device downloader"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Signing Key for Tablet Installation
        run: |
          if [ ! -f app/release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-key.jks \
              -alias pulsecut_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pulsecut123 -keypass pulsecut123 \
              -dname "CN=PulseCut Pro, OU=Tablet, O=PulseCut, L=Jodhpur, S=RJ, C=IN"
          fi

      - name: Compile APK
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Installable Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseCutPro-Tablet-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
